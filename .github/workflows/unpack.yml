name: Unpack source

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "Any_Ps3_source.zip"

permissions:
  contents: write

jobs:
  unpack:
    name: Clean and unpack Any_Ps3_source.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean, unzip and commit
        shell: bash
        run: |
          set -e
          if [ ! -f Any_Ps3_source.zip ]; then
            echo "Keine ZIP gefunden, nichts zu tun."
            exit 0
          fi
          mkdir /tmp/_new
          unzip -q Any_Ps3_source.zip -d /tmp/_new
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          if [ "$(ls -A /tmp/_new | wc -l)" = "1" ] && [ -d "/tmp/_new/$(ls /tmp/_new)" ]; then
            cp -a "/tmp/_new/$(ls /tmp/_new)/." .
          else
            cp -a /tmp/_new/. .
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Import Any_Ps3 source"
          git push
